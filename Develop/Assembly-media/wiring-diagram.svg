<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="720" fill="#101522"/>
  <text x="450" y="36" fill="#f2f2f2" font-size="22" font-weight="bold" text-anchor="middle">Prototype Wiring Diagram — XIAO nRF52840 Sense</text>
  <text x="450" y="58" fill="#9aa4bf" font-size="13" text-anchor="middle">Reference for hand-soldering unit #1. Not a formal schematic — pin positions are illustrative, not physical layout.</text>

  <!-- GND bus -->
  <line x1="60" y1="560" x2="840" y2="560" stroke="#7b8296" stroke-width="3"/>
  <text x="70" y="552" fill="#9aa4bf" font-size="12">GND bus (common return — one net, however it's physically routed)</text>

  <!-- XIAO board -->
  <rect x="380" y="120" width="110" height="400" rx="8" fill="#1d6b3a" stroke="#2f8f52" stroke-width="2"/>
  <text x="435" y="110" fill="#d8f5e2" font-size="14" font-weight="bold" text-anchor="middle">U1 — XIAO nRF52840 Sense</text>
  <rect x="415" y="104" width="40" height="14" rx="3" fill="#0b0f18" stroke="#f0c766" stroke-width="1.5"/>
  <text x="435" y="100" fill="#f0c766" font-size="10" text-anchor="middle">USB-C (top, charge + flash)</text>

  <!-- right-edge pins: D2-D7 to LEDs -->
  <g font-size="12" fill="#e4e7ee">
    <!-- D2..D7 rows -->
    <g id="pinrows">
      <line x1="490" y1="150" x2="520" y2="150" stroke="#e4e7ee" stroke-width="2"/>
      <text x="485" y="146" text-anchor="end">D2</text>
      <line x1="490" y1="200" x2="520" y2="200" stroke="#e4e7ee" stroke-width="2"/>
      <text x="485" y="196" text-anchor="end">D3</text>
      <line x1="490" y1="250" x2="520" y2="250" stroke="#e4e7ee" stroke-width="2"/>
      <text x="485" y="246" text-anchor="end">D4</text>
      <line x1="490" y1="300" x2="520" y2="300" stroke="#e4e7ee" stroke-width="2"/>
      <text x="485" y="296" text-anchor="end">D5</text>
      <line x1="490" y1="350" x2="520" y2="350" stroke="#e4e7ee" stroke-width="2"/>
      <text x="485" y="346" text-anchor="end">D6</text>
      <line x1="490" y1="400" x2="520" y2="400" stroke="#e4e7ee" stroke-width="2"/>
      <text x="485" y="396" text-anchor="end">D7</text>
    </g>
  </g>

  <!-- LEDs column -->
  <g>
    <!-- helper: LED circle + glow + cathode drop to GND, label with hang length -->
    <!-- LED1 D2 6cm -->
    <line x1="520" y1="150" x2="700" y2="150" stroke="#e4e7ee" stroke-width="2"/>
    <circle cx="715" cy="150" r="20" fill="#ffe27a" opacity="0.18"/>
    <circle cx="715" cy="150" r="6" fill="#fff6c8" stroke="#0b0f18" stroke-width="1.3"/>
    <line x1="715" y1="156" x2="715" y2="560" stroke="#e4e7ee" stroke-width="1.5"/>
    <text x="730" y="154" fill="#fff6c8" font-size="12">D1-D6 · LED 1 (hang ~6 cm)</text>

    <!-- LED2 D3 9cm -->
    <line x1="520" y1="200" x2="650" y2="200" stroke="#e4e7ee" stroke-width="2"/>
    <circle cx="665" cy="200" r="20" fill="#ffe27a" opacity="0.18"/>
    <circle cx="665" cy="200" r="6" fill="#fff6c8" stroke="#0b0f18" stroke-width="1.3"/>
    <line x1="665" y1="206" x2="665" y2="560" stroke="#e4e7ee" stroke-width="1.5"/>
    <text x="680" y="204" fill="#fff6c8" font-size="12">LED 2 (~9 cm)</text>

    <!-- LED3 D4 12cm -->
    <line x1="520" y1="250" x2="760" y2="250" stroke="#e4e7ee" stroke-width="2"/>
    <circle cx="775" cy="250" r="20" fill="#ffe27a" opacity="0.18"/>
    <circle cx="775" cy="250" r="6" fill="#fff6c8" stroke="#0b0f18" stroke-width="1.3"/>
    <line x1="775" y1="256" x2="775" y2="560" stroke="#e4e7ee" stroke-width="1.5"/>
    <text x="790" y="254" fill="#fff6c8" font-size="12">LED 3 (~12 cm)</text>

    <!-- LED4 D5 15cm -->
    <line x1="520" y1="300" x2="600" y2="300" stroke="#e4e7ee" stroke-width="2"/>
    <circle cx="615" cy="300" r="20" fill="#ffe27a" opacity="0.18"/>
    <circle cx="615" cy="300" r="6" fill="#fff6c8" stroke="#0b0f18" stroke-width="1.3"/>
    <line x1="615" y1="306" x2="615" y2="560" stroke="#e4e7ee" stroke-width="1.5"/>
    <text x="500" y="320" fill="#fff6c8" font-size="12" text-anchor="end">LED 4 (~15 cm)</text>

    <!-- LED5 D6 18cm -->
    <line x1="520" y1="350" x2="700" y2="350" stroke="#e4e7ee" stroke-width="2"/>
    <circle cx="715" cy="350" r="20" fill="#ffe27a" opacity="0.18"/>
    <circle cx="715" cy="350" r="6" fill="#fff6c8" stroke="#0b0f18" stroke-width="1.3"/>
    <line x1="715" y1="356" x2="715" y2="560" stroke="#e4e7ee" stroke-width="1.5"/>
    <text x="730" y="354" fill="#fff6c8" font-size="12">LED 5 (~18 cm)</text>

    <!-- LED6 D7 21cm = FEMALE_LED -->
    <line x1="520" y1="400" x2="650" y2="400" stroke="#e4e7ee" stroke-width="2"/>
    <circle cx="665" cy="400" r="22" fill="#ffe27a" opacity="0.22"/>
    <circle cx="665" cy="400" r="6" fill="#fff6c8" stroke="#7a5fd8" stroke-width="2"/>
    <line x1="665" y1="406" x2="665" y2="560" stroke="#e4e7ee" stroke-width="1.5"/>
    <text x="680" y="398" fill="#fff6c8" font-size="12">LED 6 (~21 cm)</text>
    <text x="680" y="413" fill="#c9b6ff" font-size="11">= FEMALE_LED (DevNote 6080015)</text>
  </g>

  <!-- optional resistor note on LED1's lead -->
  <rect x="555" y="138" width="60" height="16" rx="2" fill="none" stroke="#c9b6ff" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="585" y="133" fill="#c9b6ff" font-size="10.5" text-anchor="middle">optional R (1 kΩ)</text>

  <!-- LDR circuit, left side -->
  <line x1="380" y1="200" x2="300" y2="200" stroke="#e4e7ee" stroke-width="2"/>
  <text x="295" y="196" fill="#e4e7ee" font-size="12" text-anchor="end">D0/A0</text>
  <line x1="380" y1="170" x2="250" y2="170" stroke="#e4e7ee" stroke-width="2"/>
  <text x="245" y="166" fill="#e4e7ee" font-size="12" text-anchor="end">D1</text>

  <rect x="190" y="160" width="60" height="18" fill="#7a5fd8" stroke="#a894ff" stroke-width="1.5"/>
  <text x="220" y="154" fill="#c9b6ff" font-size="11" text-anchor="middle">LDR1 · GL5528</text>
  <line x1="220" y1="178" x2="220" y2="200" stroke="#e4e7ee" stroke-width="2"/>
  <line x1="220" y1="200" x2="300" y2="200" stroke="#e4e7ee" stroke-width="2"/>
  <circle cx="220" cy="200" r="3.5" fill="#e4e7ee"/>
  <rect x="190" y="210" width="60" height="18" fill="#4a4f5e" stroke="#9aa4bf" stroke-width="1.5"/>
  <text x="220" y="207" fill="#cfd4e4" font-size="10.5" text-anchor="middle" dy="13">R7 · 100 kΩ</text>
  <line x1="220" y1="228" x2="220" y2="560" stroke="#e4e7ee" stroke-width="1.5"/>

  <!-- Battery -->
  <rect x="330" y="600" width="160" height="60" rx="6" fill="#4a4f5e" stroke="#9aa4bf" stroke-width="2"/>
  <text x="410" y="624" fill="#e4e7ee" font-size="12" text-anchor="middle">BT1 · LiPo 500 mAh 3.7 V</text>
  <text x="410" y="640" fill="#c3c8d4" font-size="10.5" text-anchor="middle">Adafruit #1578, protected</text>
  <text x="410" y="652" fill="#c3c8d4" font-size="10" text-anchor="middle">leads soldered direct — J1 pigtail optional (batch build only)</text>
  <line x1="390" y1="600" x2="390" y2="540" stroke="#e4e7ee" stroke-width="2"/>
  <line x1="390" y1="540" x2="420" y2="540" stroke="#e4e7ee" stroke-width="2"/>
  <line x1="420" y1="540" x2="420" y2="520" stroke="#e4e7ee" stroke-width="2"/>
  <text x="425" y="524" fill="#ffb3b0" font-size="11">VIN (silkscreened pad, bottom)</text>
  <line x1="430" y1="600" x2="430" y2="560" stroke="#e4e7ee" stroke-width="2"/>
  <text x="438" y="595" fill="#9aa4bf" font-size="11">GND (bottom pad, same net as GND bus)</text>

  <!-- legend -->
  <g font-size="12" fill="#cfd4e4">
    <rect x="600" y="600" width="260" height="110" rx="6" fill="none" stroke="#7b8296" stroke-width="1"/>
    <text x="612" y="620" fill="#e4e7ee" font-weight="bold">Notes</text>
    <text x="612" y="638" font-size="11">• Purchased LEDs have a built-in, 3 V-rated</text>
    <text x="612" y="651" font-size="11">  resistor — wired direct, no external R1-R6.</text>
    <text x="612" y="664" font-size="11">  Test LED1 alone first; add a 1 kΩ (dashed,</text>
    <text x="612" y="677" font-size="11">  above) only if it reads too bright/hot.</text>
    <text x="612" y="692" font-size="11">• D1 driven HIGH only while sampling the LDR</text>
    <text x="612" y="704" font-size="11">  (~every 10 s) — divider draws ~0 µA at rest.</text>
  </g>

  <text x="450" y="702" fill="#6f7892" font-size="12" text-anchor="middle">See Assembly.md for the step-by-step build; see Spec-2 §Pin Map for the authoritative pin table.</text>
</svg>
