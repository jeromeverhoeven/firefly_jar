<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="700" fill="#0b1020"/>

  <!-- title -->
  <text x="300" y="45" fill="#f2f2f2" font-size="24" font-weight="bold" text-anchor="middle">Firefly Jar — Exterior Concept</text>
  <text x="300" y="72" fill="#9aa4bf" font-size="14" text-anchor="middle">Dusk / dark-room appearance, lid-side trigger cutouts</text>

  <!-- jar body -->
  <path d="M220,180
           L220,560
           Q220,610 270,610
           L330,610
           Q380,610 380,560
           L380,180
           Z"
        fill="#dce8e8" fill-opacity="0.10" stroke="#9fd8d8" stroke-width="3"/>

  <!-- jar glass highlight -->
  <path d="M235,200 L235,540" stroke="#ffffff" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>

  <!-- lid -->
  <rect x="205" y="140" width="190" height="45" rx="8" fill="#b7bec9"/>
  <rect x="205" y="140" width="190" height="14" rx="6" fill="#d7dbe2"/>
  <!-- lid perforations for sound / airflow -->
  <circle cx="240" cy="162" r="4" fill="#5b6270"/>
  <circle cx="260" cy="162" r="4" fill="#5b6270"/>
  <circle cx="280" cy="162" r="4" fill="#5b6270"/>

  <!-- neck band -->
  <rect x="222" y="178" width="156" height="14" fill="#9aa4bf" fill-opacity="0.4"/>

  <!-- fireflies (glow dots) -->
  <g>
    <circle cx="270" cy="260" r="16" fill="#ffe27a" opacity="0.25"/>
    <circle cx="270" cy="260" r="6" fill="#fff6c8"/>

    <circle cx="330" cy="320" r="20" fill="#ffe27a" opacity="0.3"/>
    <circle cx="330" cy="320" r="7" fill="#fff6c8"/>

    <circle cx="255" cy="400" r="14" fill="#ffe27a" opacity="0.22"/>
    <circle cx="255" cy="400" r="5" fill="#fff6c8"/>

    <circle cx="320" cy="460" r="18" fill="#ffe27a" opacity="0.28"/>
    <circle cx="320" cy="460" r="6.5" fill="#fff6c8"/>

    <circle cx="300" cy="230" r="12" fill="#ffe27a" opacity="0.18"/>
    <circle cx="300" cy="230" r="4.5" fill="#fff6c8"/>

    <circle cx="280" cy="500" r="15" fill="#ffe27a" opacity="0.2"/>
    <circle cx="280" cy="500" r="5.5" fill="#fff6c8"/>
  </g>

  <!-- fine wire stems (barely visible) -->
  <g stroke="#5b6270" stroke-width="1" opacity="0.5">
    <path d="M300,580 L270,260" fill="none"/>
    <path d="M300,580 L330,320" fill="none"/>
    <path d="M300,580 L255,400" fill="none"/>
    <path d="M300,580 L320,460" fill="none"/>
    <path d="M300,580 L300,230" fill="none"/>
    <path d="M300,580 L280,500" fill="none"/>
  </g>

  <!-- base / electronics riser (opaque, hidden deck) -->
  <rect x="235" y="560" width="130" height="45" rx="10" fill="#2a3042" stroke="#4a5368" stroke-width="2"/>
  <text x="300" y="587" fill="#9aa4bf" font-size="11" text-anchor="middle">electronics deck (hidden)</text>

  <!-- side sensor cutout callout -->
  <circle cx="378" cy="300" r="7" fill="#303645" stroke="#9aa4bf" stroke-width="1.5"/>
  <line x1="385" y1="300" x2="460" y2="260" stroke="#9aa4bf" stroke-width="1"/>
  <text x="465" y="257" fill="#cfd4e4" font-size="12">light sensor window</text>

  <!-- shake callout -->
  <path d="M470,480 q15,-20 0,-40" stroke="#9aa4bf" stroke-width="2" fill="none"/>
  <path d="M470,480 q-15,-20 0,-40" stroke="#9aa4bf" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="430" y="500" fill="#cfd4e4" font-size="12" text-anchor="middle">shake to activate</text>

  <text x="300" y="650" fill="#6f7892" font-size="12" text-anchor="middle">Conceptual rendering — not to scale. See Spec-2 for operating principle.</text>
</svg>
