<svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="720" height="720" fill="#0b1020"/>

  <!-- title -->
  <text x="320" y="42" fill="#f2f2f2" font-size="24" font-weight="bold" text-anchor="middle">Firefly Jar — Exterior Concept (Rev B)</text>
  <text x="320" y="68" fill="#9aa4bf" font-size="14" text-anchor="middle">Dark-room appearance; everything lives in the lid, fireflies hang below</text>

  <!-- lid top face (ellipse) -->
  <ellipse cx="300" cy="150" rx="95" ry="18" fill="#c9ced8" stroke="#e3e6ec" stroke-width="1.5"/>
  <!-- air holes -->
  <g fill="#4b5262">
    <circle cx="250" cy="148" r="3"/>
    <circle cx="268" cy="156" r="3"/>
    <circle cx="332" cy="156" r="3"/>
    <circle cx="350" cy="148" r="3"/>
    <circle cx="278" cy="140" r="3"/>
    <circle cx="322" cy="140" r="3"/>
  </g>
  <!-- USB-C slot -->
  <rect x="288" y="153" width="24" height="7" rx="3.5" fill="#1a1e28" stroke="#f0c766" stroke-width="1.5"/>
  <!-- LDR window -->
  <circle cx="300" cy="139" r="5" fill="#7a5fd8" stroke="#a894ff" stroke-width="1.2"/>

  <!-- screw band -->
  <path d="M205,150 L205,182 Q300,204 395,182 L395,150 Q300,172 205,150 Z" fill="#b7bec9" stroke="#d7dbe2" stroke-width="1"/>
  <g stroke="#9aa1ad" stroke-width="1">
    <path d="M205,160 Q300,182 395,160" fill="none"/>
    <path d="M205,170 Q300,192 395,170" fill="none"/>
  </g>

  <!-- jar body -->
  <path d="M220,192 L220,575 Q220,625 270,625 L330,625 Q380,625 380,575 L380,192"
        fill="#dce8e8" fill-opacity="0.10" stroke="#9fd8d8" stroke-width="3"/>
  <!-- frosted liner -->
  <path d="M228,200 L228,572 Q228,617 272,617 L328,617 Q372,617 372,572 L372,200 Z" fill="#e8eef5" fill-opacity="0.06"/>
  <!-- glass highlight -->
  <path d="M236,215 L236,555" stroke="#ffffff" stroke-opacity="0.16" stroke-width="10" stroke-linecap="round"/>

  <!-- moss -->
  <path d="M228,600 Q245,560 270,578 Q290,552 312,574 Q338,556 352,580 Q366,566 372,592 L372,605 Q372,617 360,617 L240,617 Q228,617 228,605 Z" fill="#2f5d3a"/>
  <g fill="#3f7a4c">
    <circle cx="255" cy="595" r="8"/><circle cx="292" cy="590" r="9"/><circle cx="330" cy="593" r="8"/><circle cx="356" cy="600" r="7"/>
  </g>

  <!-- hanging leads (barely visible) -->
  <g stroke="#6b7488" stroke-width="1" opacity="0.55" fill="none">
    <path d="M262,200 L258,262"/>
    <path d="M285,200 Q290,280 283,330"/>
    <path d="M300,200 L304,400"/>
    <path d="M316,200 Q322,330 318,450"/>
    <path d="M335,200 Q328,300 338,380"/>
    <path d="M348,200 Q342,400 350,505"/>
  </g>

  <!-- fireflies (glow dots at lead ends) -->
  <g>
    <circle cx="258" cy="262" r="15" fill="#ffd54a" opacity="0.25"/><circle cx="258" cy="262" r="5.5" fill="#fff1b0"/>
    <circle cx="283" cy="330" r="19" fill="#ffd54a" opacity="0.3"/><circle cx="283" cy="330" r="6.5" fill="#fff1b0"/>
    <circle cx="304" cy="400" r="13" fill="#ffd54a" opacity="0.2"/><circle cx="304" cy="400" r="5" fill="#fff1b0"/>
    <circle cx="318" cy="450" r="18" fill="#ffd54a" opacity="0.28"/><circle cx="318" cy="450" r="6" fill="#fff1b0"/>
    <circle cx="338" cy="380" r="11" fill="#ffd54a" opacity="0.16"/><circle cx="338" cy="380" r="4" fill="#fff1b0"/>
    <circle cx="350" cy="505" r="15" fill="#ffd54a" opacity="0.22"/><circle cx="350" cy="505" r="5.5" fill="#fff1b0"/>
  </g>

  <!-- callouts -->
  <g stroke="#9aa4bf" stroke-width="1" fill="none">
    <line x1="312" y1="157" x2="470" y2="184"/>
    <line x1="350" y1="148" x2="470" y2="148"/>
    <line x1="303" y1="137" x2="470" y2="112"/>
    <line x1="372" y1="595" x2="470" y2="600"/>
    <line x1="380" y1="300" x2="470" y2="300"/>
  </g>
  <g fill="#cfd4e4" font-size="12.5">
    <text x="476" y="188">USB-C charge port (DD-3, DD-7)</text>
    <text x="476" y="152">"Air holes" (DD-6)</text>
    <text x="476" y="116">Light sensor window (DD-1)</text>
    <text x="476" y="296">PET jar for ages ≤ 12,</text>
    <text x="476" y="312">glass for 13-16 (DD-10)</text>
    <text x="476" y="604">Preserved (dry) moss</text>
  </g>

  <!-- tap / shake callout -->
  <path d="M135,420 q-16,-22 0,-44" stroke="#9aa4bf" stroke-width="2" fill="none"/>
  <path d="M150,420 q-16,-22 0,-44" stroke="#9aa4bf" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="140" y="446" fill="#cfd4e4" font-size="12.5" text-anchor="middle">tap / shake</text>
  <text x="140" y="462" fill="#cfd4e4" font-size="12.5" text-anchor="middle">to wake (DD-1)</text>
  <text x="140" y="300" fill="#cfd4e4" font-size="12.5" text-anchor="middle">6 yellow 0603</text>
  <text x="140" y="316" fill="#cfd4e4" font-size="12.5" text-anchor="middle">"fireflies"</text>
  <text x="140" y="332" fill="#cfd4e4" font-size="12.5" text-anchor="middle">(DD-4, DD-8)</text>
  <line x1="190" y1="315" x2="270" y2="328" stroke="#9aa4bf" stroke-width="1"/>

  <text x="320" y="680" fill="#6f7892" font-size="12" text-anchor="middle">Conceptual rendering — not to scale. See Spec-2 for operating principle.</text>
</svg>
