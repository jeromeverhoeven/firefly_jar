<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="700" fill="#101522"/>

  <text x="350" y="40" fill="#f2f2f2" font-size="22" font-weight="bold" text-anchor="middle">Internal Layout — Section View</text>
  <text x="350" y="64" fill="#9aa4bf" font-size="13" text-anchor="middle">Electronics deck, battery pack, LED "firefly" stems, sensors</text>

  <!-- jar outline (section) -->
  <path d="M250,140
           L250,540
           Q250,590 300,590
           L400,590
           Q450,590 450,540
           L450,140
           Z"
        fill="#dce8e8" fill-opacity="0.06" stroke="#9fd8d8" stroke-width="2"/>

  <!-- lid -->
  <rect x="235" y="110" width="230" height="35" rx="6" fill="#b7bec9"/>

  <!-- electronics deck (false bottom) -->
  <rect x="260" y="500" width="180" height="20" fill="#3a4258" stroke="#6b7590" stroke-width="1"/>
  <text x="350" y="494" fill="#cfd4e4" font-size="11" text-anchor="middle">false-bottom deck</text>

  <!-- PCB -->
  <rect x="275" y="520" width="150" height="45" rx="4" fill="#1d6b3a" stroke="#2f8f52" stroke-width="2"/>
  <text x="350" y="547" fill="#d8f5e2" font-size="11" text-anchor="middle">MCU + drive PCB</text>

  <!-- battery holder -->
  <rect x="285" y="565" width="130" height="35" rx="4" fill="#4a4f5e" stroke="#7b8296" stroke-width="2"/>
  <text x="350" y="587" fill="#e4e7ee" font-size="11" text-anchor="middle">2xAA battery holder + switch</text>

  <!-- tilt switch -->
  <circle cx="300" cy="533" r="9" fill="#d7a23a" stroke="#f0c766" stroke-width="1.5"/>
  <text x="300" y="515" fill="#f0c766" font-size="10" text-anchor="middle">tilt sw.</text>

  <!-- LDR mounted through jar wall -->
  <circle cx="447" cy="300" r="10" fill="#7a5fd8" stroke="#a894ff" stroke-width="1.5"/>
  <line x1="447" y1="300" x2="520" y2="270" stroke="#a894ff" stroke-width="1"/>
  <text x="525" y="267" fill="#cfbfff" font-size="11">LDR (light sensor)</text>

  <!-- LED firefly stems from PCB -->
  <g>
    <line x1="330" y1="522" x2="300" y2="220" stroke="#8a93ab" stroke-width="1.2"/>
    <circle cx="300" cy="220" r="14" fill="#ffe27a" opacity="0.25"/>
    <circle cx="300" cy="220" r="5.5" fill="#fff6c8"/>

    <line x1="350" y1="522" x2="370" y2="250" stroke="#8a93ab" stroke-width="1.2"/>
    <circle cx="370" cy="250" r="16" fill="#ffe27a" opacity="0.28"/>
    <circle cx="370" cy="250" r="6" fill="#fff6c8"/>

    <line x1="365" y1="522" x2="330" y2="330" stroke="#8a93ab" stroke-width="1.2"/>
    <circle cx="330" cy="330" r="13" fill="#ffe27a" opacity="0.22"/>
    <circle cx="330" cy="330" r="5" fill="#fff6c8"/>

    <line x1="340" y1="522" x2="390" y2="370" stroke="#8a93ab" stroke-width="1.2"/>
    <circle cx="390" cy="370" r="15" fill="#ffe27a" opacity="0.26"/>
    <circle cx="390" cy="370" r="5.5" fill="#fff6c8"/>

    <line x1="320" y1="522" x2="310" y2="420" stroke="#8a93ab" stroke-width="1.2"/>
    <circle cx="310" cy="420" r="12" fill="#ffe27a" opacity="0.2"/>
    <circle cx="310" cy="420" r="4.5" fill="#fff6c8"/>

    <line x1="310" y1="522" x2="360" y2="450" stroke="#8a93ab" stroke-width="1.2"/>
    <circle cx="360" cy="450" r="13" fill="#ffe27a" opacity="0.22"/>
    <circle cx="360" cy="450" r="5" fill="#fff6c8"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#cfd4e4">
    <rect x="490" y="440" width="12" height="12" fill="#1d6b3a"/>
    <text x="508" y="450">MCU / LED driver board</text>

    <rect x="490" y="462" width="12" height="12" fill="#4a4f5e"/>
    <text x="508" y="472">Battery pack (2xAA)</text>

    <circle cx="496" cy="490" r="6" fill="#d7a23a"/>
    <text x="508" y="494">Tilt / vibration switch</text>

    <circle cx="496" cy="512" r="6" fill="#7a5fd8"/>
    <text x="508" y="516">Light sensor (LDR)</text>

    <circle cx="496" cy="534" r="6" fill="#fff6c8"/>
    <text x="508" y="538">Diffused LED "firefly"</text>
  </g>

  <text x="350" y="660" fill="#6f7892" font-size="12" text-anchor="middle">Conceptual section — not to scale. See Spec-2 §Operating Principle for circuit behavior.</text>
</svg>
