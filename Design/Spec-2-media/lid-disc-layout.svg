<text x="590" y="394" fill="#9aa4bf" font-size="11">Anchor ring r = 26 mm; anchors ~18 mm</text>
<text x="590" y="411" fill="#9aa4bf" font-size="11">apart (≥ 8 mm required).</text>
<text x="590" y="428" fill="#9aa4bf" font-size="11">Each lead loops up through its hole</text>
<text x="590" y="445" fill="#9aa4bf" font-size="11">pair and back down, gets a hot-glue</text>
<text x="590" y="462" fill="#9aa4bf" font-size="11">dab, then a service loop to its pin.</text>
<text x="590" y="479" fill="#9aa4bf" font-size="11">Hang lengths ≈ 6/9/12/15/18/21 cm.</text>
<text x="590" y="496" fill="#9aa4bf" font-size="11">Min. feature clearance ≈ 9 mm; cell</text>
<text x="590" y="513" fill="#9aa4bf" font-size="11">corner at r ≈ 28 mm (opening r ≈ 30).</text>
<text x="590" y="530" fill="#9aa4bf" font-size="11">XIAO slot 9.5 x 3.5 mm, port up.</text>
<text x="440" y="660" fill="#6f7892" font-size="12" text-anchor="middle">Not to manufacturing tolerance — confirm jar opening and band inner diameter before cutting discs. See DD-7.</text>
